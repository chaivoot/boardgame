<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ชายชุดดำ — Men in Black</title>
<meta name="description" content="ชายชุดดำ เกมสืบสวนหาฆาตกรในตึก เล่นด้วยมือถือเครื่องเดียว มีผู้ดำเนินเกมอัตโนมัติ">
<meta name="theme-color" content="#0b0c0e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600&family=Sarabun:wght@400;600&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0c0e; --panel:#14171b; --panel2:#1b1f25; --line:#2a2f37;
  --text:#e8ebf0; --muted:#8d95a1; --silver:#c9ced6;
  --good:#5ad1c8; --evil:#ff5a5f; --gold:#f2b84b; --empty:#7d8aa0;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Sarabun,system-ui,sans-serif;font-size:16px;line-height:1.5}
body{min-height:100vh;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;padding:16px 16px 96px}
h1,h2,h3{font-family:Kanit,sans-serif;font-weight:500;margin:0 0 8px;line-height:1.25}
h1{font-size:28px} h2{font-size:22px} h3{font-size:17px}
p{margin:0 0 12px}
.muted{color:var(--muted)} .small{font-size:14px}
.center{text-align:center}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px}
.stack>*+*{margin-top:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.btn{appearance:none;border:1px solid var(--line);background:var(--panel2);color:var(--text);font:inherit;font-family:Kanit,sans-serif;
  padding:12px 16px;border-radius:12px;cursor:pointer;min-height:48px;transition:transform .05s,background .15s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--silver);color:#0b0c0e;border-color:var(--silver);font-weight:600}
.btn.danger{border-color:var(--evil);color:var(--evil)}
.btn.ghost{background:transparent}
.btn.block{display:block;width:100%}
.btn.sel{outline:2px solid var(--good);outline-offset:2px;background:#1d2a2c}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
input[type=text],select{width:100%;font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
label.chk{display:flex;gap:10px;align-items:center;padding:6px 0;cursor:pointer}
label.chk input{width:20px;height:20px;accent-color:var(--good)}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:8px}
.brand{display:flex;align-items:center;gap:10px;font-family:Kanit;font-size:18px;letter-spacing:.5px}
.brand svg{width:34px;height:20px}
.tag{display:inline-block;font-size:12px;font-family:Kanit;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.tag.good{color:var(--good);border-color:var(--good)} .tag.evil{color:var(--evil);border-color:var(--evil)}

/* hero */
.hero{text-align:center;padding:24px 0 8px}
.hero .logo{width:160px;height:90px;margin:0 auto 8px;display:block}
.hero h1{font-size:44px;letter-spacing:2px}
.hero .en{font-family:Oswald;letter-spacing:6px;color:var(--muted);font-size:14px}

/* cards */
.card{width:100%;max-width:250px;display:block;margin:0 auto;filter:drop-shadow(0 10px 24px rgba(0,0,0,.6))}
.cards-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cards-strip .card{max-width:none}

/* board */
.board{display:grid;gap:6px}
.floor{display:grid;grid-template-columns:44px repeat(3,1fr);gap:6px}
.flabel{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;background:#101215;border:1px dashed var(--line);font-family:Kanit;color:var(--muted);font-size:13px;line-height:1.1}
.flabel b{font-size:18px;color:var(--silver);font-weight:500}
.room{position:relative;aspect-ratio:1.25;border-radius:10px;border:1px solid var(--line);background:linear-gradient(160deg,#1c2026,#121418);
  color:var(--silver);font-family:Oswald;font-size:24px;letter-spacing:1px;display:flex;align-items:center;justify-content:center;padding:0;cursor:default}
.room.pick{cursor:pointer;border-color:#3b434e}
.room.pick:hover{border-color:var(--silver)}
.room.sel{outline:3px solid var(--good);outline-offset:1px}
.room.dis{opacity:.35}
.room .mk{position:absolute;inset:3px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Kanit;font-size:12px;line-height:1.1;text-align:center}
.room .mk b{font-family:Oswald;font-size:15px;letter-spacing:1px}
.mk.murdered{background:repeating-linear-gradient(45deg,#3a1215,#3a1215 6px,#2c0e10 6px,#2c0e10 12px);color:#ffb3b5;border:1px solid var(--evil)}
.mk.empty{background:#1a2230;color:#b9c4d6;border:1px solid var(--empty)}
.mk.mob{background:#36280c;color:#ffd98f;border:1px solid var(--gold)}
.cols{display:grid;grid-template-columns:44px repeat(3,1fr);gap:6px;font-family:Kanit;font-size:12px;color:var(--muted);text-align:center}
.daytrack{display:flex;gap:8px;justify-content:center;margin-top:10px}
.daytrack span{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:Oswald;color:var(--muted)}
.daytrack span.past{background:#22262c;color:var(--muted);text-decoration:line-through}
.daytrack span.now{border-color:var(--silver);color:var(--bg);background:var(--silver)}

/* misc */
.bigmsg{font-family:Kanit;font-size:22px;text-align:center;padding:12px 0}
.result{border:1px solid var(--good);background:#0f1f20;border-radius:14px;padding:18px;text-align:center;font-family:Kanit;font-size:20px}
.result.evil{border-color:var(--evil);background:#22100f}
.note{border-left:3px solid var(--gold);padding:8px 12px;background:#1d1a12;border-radius:0 10px 10px 0;font-size:15px}
.timer{font-family:Oswald;font-size:56px;text-align:center;letter-spacing:2px}
.plist{display:grid;gap:6px}
.pitem{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.pitem.dead{opacity:.5;text-decoration:line-through}
.log{font-size:14px;color:var(--muted)}
.log div{padding:4px 0;border-bottom:1px solid #1d2127}
.night{background:radial-gradient(ellipse at top,#121a2a 0,#0b0c0e 70%)}
.keycard{width:100%;max-width:250px;margin:12px auto 0;display:block}
.hidden-tip{padding:48px 16px;text-align:center;border:1px dashed var(--line);border-radius:14px}
.overlay{position:fixed;inset:0;background:rgba(5,6,8,.92);z-index:10;overflow:auto}
.overlay .inner{max-width:560px;margin:0 auto;padding:16px}
.rules h3{margin-top:16px}
.rules ul{padding-left:20px;margin:0 0 8px}
table.roles{width:100%;border-collapse:collapse;font-size:14px}
table.roles td,table.roles th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
.fab{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:24px 16px calc(16px + env(safe-area-inset-bottom))}
.fab .wrap{max-width:528px;margin:0 auto;display:flex;gap:8px}
.fab .wrap .btn{flex:1}
@media (max-width:380px){.room{font-size:19px}.hero h1{font-size:36px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="overlay"></div>
<script>
'use strict';

/* ================= DATA ================= */
const ROLES = {
  drunk:        {order:1, en:'DRUNK',          th:'คนเมา',        team:'good', act:'player',
                 desc:'ครั้งเดียวต่อเกม: เลือกผู้เล่น 1 คนเพื่อสลับห้องกัน (จะไม่ใช้คืนนี้ก็ได้)'},
  keymaster:    {order:2, en:'KEYMASTER',      th:'ช่างกุญแจ',    team:'good', act:'room',
                 desc:'เลือกล็อก 1 ห้อง ให้ปลอดภัยจากฆาตกรในคืนนั้น (ห้ามล็อกห้องเดิมซ้ำกับคืนก่อน)'},
  housekeeper:  {order:3, en:'HOUSEKEEPER',    th:'แม่บ้าน',      team:'good', act:'floor',
                 desc:'เลือกตรวจ 1 ชั้น เพื่อรู้จำนวนผู้รอดชีวิตในชั้นนั้น'},
  windowcleaner:{order:4, en:'WINDOW CLEANER', th:'ช่างเช็ดกระจก', team:'good', act:'col',
                 desc:'เลือกตรวจ 1 แถวแนวตั้ง เพื่อรู้จำนวนผู้รอดชีวิตในแถวนั้น'},
  detective:    {order:5, en:'DETECTIVE',      th:'นักสืบ',       team:'good', act:'player',
                 desc:'เลือกผู้เล่น 1 คน เพื่อรู้ว่าเขาพักอยู่ชั้นไหน'},
  accomplice:   {order:6, en:'ACCOMPLICE',     th:'ผู้ช่วย',       team:'evil', act:'player',
                 desc:'ฝ่ายฆาตกร ตื่นพร้อมฆาตกร เลือกผู้เล่น 1 คน เพื่อรู้ว่าเขาพักอยู่ชั้นไหน'},
  murderer:     {order:7, en:'MURDERER',       th:'ฆาตกร',        team:'evil', act:'room',
                 desc:'เลือก 1 ห้องเพื่อลงมือฆาตกรรมในคืนนั้น'},
  witness:      {order:8, en:'WITNESS',        th:'พยาน',         team:'good', act:'floor',
                 desc:'เลือกเฝ้า 1 ชั้น ถ้าฆาตกรลงมือในชั้นนั้น จะรู้ว่าห้องของฆาตกรอยู่สูงกว่า ต่ำกว่า หรือชั้นเดียวกัน'},
  guest:        {order:0, en:'GUEST',          th:'แขก',          team:'good', act:null,
                 desc:'ไม่มีความสามารถตอนกลางคืน ใช้การสังเกตและเหตุผลช่วยฝ่ายคนดี'}
};
const SPECIAL = ['murderer','accomplice','detective','keymaster','housekeeper','windowcleaner','witness','drunk'];
const PRESET = {
  4:['murderer','detective','keymaster','housekeeper'],
  5:['murderer','detective','keymaster','housekeeper','witness'],
  6:['murderer','accomplice','detective','keymaster','housekeeper','witness'],
  7:['murderer','accomplice','detective','keymaster','housekeeper','witness','windowcleaner'],
  8:['murderer','accomplice','detective','keymaster','housekeeper','witness','windowcleaner','drunk'],
  9:['murderer','accomplice','detective','keymaster','housekeeper','witness','windowcleaner','drunk']
};
const floorsFor = n => Math.max(2, Math.min(5, Math.ceil(n * 1.5 / 3)));
const daysFor = n => n <= 4 ? 2 : n <= 6 ? 3 : 4;
const COLOR = {good:'#5ad1c8', evil:'#ff5a5f'};

const ICONS = {
  murderer:'<path d="M32 4 L38 14 V38 H26 V14 Z"/><path d="M32 12 V34"/><path d="M18 38 H46"/><path d="M28 42 H36 V54 H28 Z"/><circle cx="32" cy="58" r="2.5"/>',
  accomplice:'<path d="M5 24 C5 17 16 17 32 22 C48 17 59 17 59 24 C59 37 50 43 42 41 C36 39 34 33 32 33 C30 33 28 39 22 41 C14 43 5 37 5 24Z"/><path d="M14 28 C17 25 23 25 26 29 C23 32 17 32 14 28Z"/><path d="M38 29 C41 25 47 25 50 28 C47 32 41 32 38 29Z"/>',
  detective:'<circle cx="26" cy="26" r="16"/><path d="M19 22 C20 18 24 16 28 17"/><path d="M38 38 L56 56" stroke-width="5"/>',
  keymaster:'<circle cx="18" cy="32" r="11"/><circle cx="18" cy="32" r="4"/><path d="M29 32 H58"/><path d="M50 32 V42"/><path d="M42 32 V39"/>',
  housekeeper:'<path d="M46 4 L33 32"/><path d="M24 30 L42 38 L36 58 C27 58 16 54 11 47 Z"/><path d="M19 44 L33 50"/><path d="M15 39 L22 46"/><path d="M28 34 L24 55"/>',
  windowcleaner:'<rect x="8" y="6" width="40" height="46" rx="2"/><path d="M28 6 V52 M8 29 H48"/><path d="M40 36 L56 52"/><path d="M50 58 L62 46"/>',
  witness:'<path d="M4 32 C14 15 50 15 60 32 C50 49 14 49 4 32Z"/><circle cx="32" cy="32" r="9"/><circle cx="32" cy="32" r="3" fill="currentColor"/>',
  drunk:'<path d="M10 10 H54 L32 34 Z"/><path d="M15 15 H49"/><path d="M32 34 V54 M20 56 H44"/><circle cx="44" cy="8" r="4"/><path d="M41 11 L36 18"/>',
  guest:'<rect x="8" y="20" width="48" height="34" rx="4"/><path d="M24 20 V13 H40 V20"/><path d="M8 33 H56"/><path d="M28 30 V36 H36 V30"/>'
};
const LOGO = '<svg viewBox="0 0 64 36" fill="currentColor" aria-hidden="true"><path d="M2 6 H62 V10 H58 C58 24 50 30 42 30 C35 30 34 22 33 14 H31 C30 22 29 30 22 30 C14 30 6 24 6 10 H2 Z"/></svg>';

/* ================= HELPERS ================= */
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const floorOf = room => Math.floor(room / 100);
const colOf = room => room % 100;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function load(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}}
function drop(k){try{localStorage.removeItem(k);}catch(e){}}

function cardSVG(k){
  const r = ROLES[k], c = COLOR[r.team];
  const badge = r.order ? `<g transform="translate(38 38)"><path d="M0 -16 L16 0 L0 16 L-16 0Z" fill="#0d0f12" stroke="${c}" stroke-width="1.5"/><text y="6" text-anchor="middle" font-family="Oswald" font-size="16" fill="${c}">${r.order}</text></g>` : '';
  return `<svg class="card" viewBox="0 0 250 350" role="img" aria-label="${r.en} ${r.th}">
  <defs><linearGradient id="g${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#181b20"/><stop offset="1" stop-color="#0a0b0d"/></linearGradient></defs>
  <rect x="2" y="2" width="246" height="346" rx="16" fill="url(#g${k})" stroke="#2a2f37" stroke-width="2"/>
  <path d="M16 34 L34 16 H216 L234 34 V316 L216 334 H34 L16 316Z" fill="none" stroke="${c}" stroke-width="1.2" opacity=".85"/>
  <path d="M60 16 H190" stroke="${c}" stroke-width="4"/>
  ${badge}
  <circle cx="125" cy="128" r="64" fill="#101317" stroke="${c}" stroke-width="2"/>
  <circle cx="125" cy="128" r="56" fill="none" stroke="${c}" stroke-width=".8" stroke-dasharray="2 5" opacity=".7"/>
  <g transform="translate(83 86) scale(1.31)" fill="none" stroke="${c}" color="${c}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]}</g>
  <text x="125" y="236" text-anchor="middle" font-family="Oswald" font-weight="600" font-size="${r.en.length>11?22:27}" letter-spacing="3" fill="#e8ebf0">${r.en}</text>
  <text x="125" y="262" text-anchor="middle" font-family="Kanit" font-size="17" fill="${c}">${r.th}</text>
  <path d="M70 280 H180" stroke="#2a2f37"/>
  <text x="125" y="304" text-anchor="middle" font-family="Oswald" font-size="12" letter-spacing="4" fill="#8d95a1">${r.team==='evil'?'SHADOW SIDE':'TENANT SIDE'}</text>
  </svg>`;
}
function keycardSVG(room){
  return `<svg class="keycard" viewBox="0 0 250 150" role="img" aria-label="Keycard ${room}">
  <rect x="2" y="2" width="246" height="146" rx="14" fill="#e8ebf0"/>
  <rect x="2" y="2" width="246" height="34" rx="14" fill="#0b0c0e"/><rect x="2" y="22" width="246" height="14" fill="#0b0c0e"/>
  <text x="18" y="25" font-family="Oswald" font-size="14" letter-spacing="4" fill="#e8ebf0">KEYCARD</text>
  <g transform="translate(196 9) scale(.7)" fill="#e8ebf0">${LOGO.replace(/<\/?svg[^>]*>/g,'')}</g>
  <text x="18" y="112" font-family="Oswald" font-weight="600" font-size="64" fill="#0b0c0e">${room}</text>
  <text x="232" y="98" text-anchor="end" font-family="Kanit" font-size="15" fill="#4a515c">ชั้น ${floorOf(room)}</text>
  <text x="232" y="118" text-anchor="end" font-family="Kanit" font-size="15" fill="#4a515c">แถว ${colOf(room)}</text>
  <rect x="18" y="126" width="80" height="8" rx="2" fill="#c9ced6"/>
  </svg>`;
}

/* ================= SPEECH ================= */
let PREF = load('mib-pref') || {voice:true, reveal:false, timer:5};
function say(text, interrupt){
  if(!PREF.voice || !('speechSynthesis' in window)) return;
  try{
    if(interrupt) speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'th-TH'; u.rate = .92;
    const v = speechSynthesis.getVoices().find(v => /^th/i.test(v.lang));
    if(v) u.voice = v;
    speechSynthesis.speak(u);
  }catch(e){}
}
if('speechSynthesis' in window){ try{ speechSynthesis.getVoices(); }catch(e){} }

/* ================= STATE ================= */
let S = load('mib-setup') || makeSetup(6);
let G = load('mib-game');
let view = 'home';
let timerInt = null, waitTimer = null;

function makeSetup(n, names){
  const nm = []; for(let i=0;i<n;i++) nm.push((names&&names[i]) || `ผู้เล่น ${i+1}`);
  return {n, names:nm, roles:PRESET[n].slice(), floors:floorsFor(n), days:daysFor(n)};
}
const holderOf = role => G.players.find(p => p.role === role);
const isEvil = p => ROLES[p.role].team === 'evil';
const allRooms = () => { const r=[]; for(let f=1; f<=G.floors; f++) for(let c=1;c<=3;c++) r.push(f*100+c); return r; };
const livingIn = pred => G.players.filter(p => p.alive && pred(p.room)).length;

function startGame(){
  const n = S.n;
  const roles = S.roles.slice(); while(roles.length < n) roles.push('guest');
  const dealt = shuffle(roles);
  const rooms = shuffle((()=>{const r=[];for(let f=1;f<=S.floors;f++)for(let c=1;c<=3;c++)r.push(f*100+c);return r;})()).slice(0,n);
  G = {
    players: S.names.map((name,i) => ({name:name.trim()||`ผู้เล่น ${i+1}`, role:dealt[i], room:rooms[i], startRoom:rooms[i], alive:true, death:null})),
    floors:S.floors, maxDays:S.days, day:1, phase:'deal', dealIdx:0, dealShown:false,
    marks:{}, lastLock:null, drunkUsed:false, notices:[], log:[], history:[], nt:null,
    rolesInPlay: roles.filter(r=>r!=='guest')
  };
  view = 'game';
}

/* ================= NIGHT ================= */
function nightSteps(){
  return G.rolesInPlay.filter(r => ROLES[r].act).sort((a,b) => ROLES[a].order - ROLES[b].order);
}
function beginNight(){
  G.phase = 'nightIntro';
  G.nt = {steps:nightSteps(), i:0, done:false, sel:null, result:'', lock:null, kill:null, spoken:-1, waitEnd:0, acts:[]};
}
function callLine(role){
  const hasAcc = G.rolesInPlay.includes('accomplice');
  switch(role){
    case 'drunk': return 'คนเมา ลืมตา จะสลับห้องกับใครไหม';
    case 'keymaster': return 'ช่างกุญแจ ลืมตา เลือกห้องที่จะล็อก';
    case 'housekeeper': return 'แม่บ้าน ลืมตา เลือกชั้นที่จะตรวจ';
    case 'windowcleaner': return 'ช่างเช็ดกระจก ลืมตา เลือกแถวที่จะตรวจ';
    case 'detective': return 'นักสืบ ลืมตา เลือกผู้เล่นที่จะสืบ';
    case 'accomplice': return 'ฝ่ายฆาตกร ลืมตา ผู้ช่วยเลือกผู้เล่นที่จะสืบ';
    case 'murderer': return hasAcc ? 'ฆาตกร เลือกห้องที่จะลงมือ' : 'ฆาตกร ลืมตา เลือกห้องที่จะลงมือ';
    case 'witness': return 'พยาน ลืมตา เลือกชั้นที่จะเฝ้า';
  }
}
function closeLine(role){
  if(role === 'accomplice') return '';
  if(role === 'murderer') return G.rolesInPlay.includes('accomplice') ? 'ฝ่ายฆาตกร หลับตา' : 'ฆาตกร หลับตา';
  return ROLES[role].th + ' หลับตา';
}
function canAct(role){
  const h = holderOf(role);
  if(!h || !h.alive) return false;
  if(role === 'drunk' && G.drunkUsed) return false;
  return true;
}
function allowedRooms(role){
  const h = holderOf(role);
  return allRooms().filter(r => {
    if(G.marks[r]) return false;
    if(role === 'murderer' && r === h.room) return false;
    if(role === 'keymaster' && r === G.lastLock) return false;
    return true;
  });
}
function applyAction(role, v){
  const h = holderOf(role), nt = G.nt; let text = '';
  switch(role){
    case 'drunk':
      if(v === null){ text = 'คืนนี้ไม่สลับห้อง'; break; }
      { const t = G.players[v]; const a = h.room; h.room = t.room; t.room = a; G.drunkUsed = true;
        G.notices.push({p:v, text:`ห้องของคุณถูกสลับระหว่างคืน! คีย์การ์ดใหม่ของคุณคือห้อง ${t.room}`});
        text = `สลับห้องกับ ${t.name} แล้ว<br>ห้องใหม่ของคุณคือ <b>${h.room}</b>`; }
      break;
    case 'keymaster': nt.lock = v; text = `ล็อกห้อง <b>${v}</b> แล้ว ห้องนี้ปลอดภัยคืนนี้`; break;
    case 'housekeeper': text = `ชั้น ${v} มีผู้รอดชีวิต <b>${livingIn(r => floorOf(r) === v)}</b> คน`; break;
    case 'windowcleaner': text = `แถว ${v} (ห้อง x0${v}) มีผู้รอดชีวิต <b>${livingIn(r => colOf(r) === v)}</b> คน`; break;
    case 'detective':
    case 'accomplice': { const t = G.players[v]; text = `${esc(t.name)} พักอยู่ <b>ชั้น ${floorOf(t.room)}</b>`; } break;
    case 'murderer': nt.kill = v; text = `เลือกลงมือที่ห้อง <b>${v}</b>`; break;
    case 'witness': {
      const m = holderOf('murderer');
      if(nt.kill !== null && floorOf(nt.kill) === v){
        const mf = floorOf(m.room);
        const rel = mf > v ? 'สูงกว่า' : mf < v ? 'ต่ำกว่า' : 'อยู่ชั้นเดียวกับ';
        text = `เห็นฆาตกรขึ้นมาลงมือที่ชั้น ${v}!<br>ห้องของฆาตกร <b>${rel}</b>ชั้นนี้`;
      } else text = `ชั้น ${v} เงียบสงบ ไม่เห็นฆาตกร`;
    } break;
  }
  nt.result = text; nt.done = true;
  nt.acts.push({role, who:h.name, text:text.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim()});
}
function nextStep(){
  const nt = G.nt; const role = nt.steps[nt.i];
  const cl = closeLine(role); if(cl) say(cl);
  nt.i++; nt.done = false; nt.sel = null; nt.result = ''; nt.waitEnd = 0; nt.note = null;
  if(nt.i >= nt.steps.length) endNight();
}
function endNight(){
  const nt = G.nt, lines = [];
  G.lastLock = nt.lock;
  const k = nt.kill;
  if(k === null || k === nt.lock){
    lines.push('คืนนี้สงบ ไม่มีใครเสียชีวิต');
  } else {
    const v = G.players.find(p => p.alive && p.room === k);
    if(v){
      v.alive = false; v.death = `ถูกฆาตกรรมคืนที่ ${G.day}`; G.marks[k] = 'murdered';
      lines.push(`ห้อง ${k} — ฆาตกรรม! ${esc(v.name)} เสียชีวิต${PREF.reveal ? ` (${ROLES[v.role].en})` : ''}`);
    } else {
      G.marks[k] = 'empty';
      lines.push(`ห้อง ${k} — ห้องว่าง (ฆาตกรบุกเข้าห้องที่ไม่มีคนพัก)`);
    }
  }
  G.history.push({night:G.day, acts:nt.acts, kill:k, lock:nt.lock});
  lines.forEach(l => G.log.push(`คืนที่ ${G.day}: ${l}`));
  G.morning = {lines, noticeShown:false};
  G.phase = 'morning';
  say('ทุกคน ลืมตา');
  const w = checkWin(); if(w) return endGame(w);
}

/* ================= DAY ================= */
function checkWin(){
  const m = holderOf('murderer');
  if(!m.alive) return {winner:'good', reason:'ฆาตกรถูกประชาทัณฑ์สำเร็จ'};
  const alive = G.players.filter(p => p.alive);
  const evil = alive.filter(isEvil).length;
  if(alive.length - evil <= evil) return {winner:'evil', reason:'ฝ่ายผู้เช่าเหลือไม่มากกว่าฝ่ายเงามืด'};
  return null;
}
function resolveVote(room){
  let line;
  if(room === null){ line = 'วันนี้ไม่มีการประชาทัณฑ์'; }
  else {
    const v = G.players.find(p => p.alive && p.room === room);
    if(v){
      v.alive = false; v.death = `ถูกประชาทัณฑ์วันที่ ${G.day}`; G.marks[room] = 'mob';
      const showRole = PREF.reveal || v.role === 'murderer';
      line = `ประชาทัณฑ์ห้อง ${room} — ${esc(v.name)} ถูกกำจัด${showRole ? ` (${ROLES[v.role].en})` : ''}`;
    } else { G.marks[room] = 'empty'; line = `ประชาทัณฑ์ห้อง ${room} — ห้องว่าง ไม่มีใครพักอยู่`; }
  }
  G.log.push(`วันที่ ${G.day}: ${line}`);
  G.voteLine = line; G.phase = 'voteResult';
  const w = checkWin(); if(w) return endGame(w);
  if(G.day >= G.maxDays) return endGame({winner:'evil', reason:`ครบ ${G.maxDays} วันแล้ว ฆาตกรยังลอยนวล`});
}
function endGame(w){ G.result = w; G.phase = 'end'; say(w.winner === 'good' ? 'ฝ่ายผู้เช่า ชนะ' : 'ฝ่ายเงามืด ชนะ'); }

/* ================= RENDER ================= */
const app = document.getElementById('app');
const ov = document.getElementById('overlay');

function boardHTML(opt = {}){
  const {pick = null, sel = null} = opt;
  let h = '<div class="board">';
  for(let f = G.floors; f >= 1; f--){
    h += `<div class="floor"><div class="flabel"><span>ชั้น</span><b>${f}</b></div>`;
    for(let c = 1; c <= 3; c++){
      const r = f*100 + c, mk = G.marks[r];
      const can = pick && pick.includes(r);
      const cls = ['room', can ? 'pick' : '', pick && !can ? 'dis' : '', sel === r ? 'sel' : ''].join(' ');
      const m = mk ? `<span class="mk ${mk}"><b>${r}</b>${mk==='murdered'?'ฆาตกรรม':mk==='empty'?'ห้องว่าง':'ประชาทัณฑ์'}</span>` : '';
      h += `<button class="${cls}" ${can ? `data-a="pickRoom" data-v="${r}"` : 'tabindex="-1"'} aria-label="ห้อง ${r}">${r}${m}</button>`;
    }
    h += '</div>';
  }
  h += '<div class="cols"><span></span><span>แถว 1</span><span>แถว 2</span><span>แถว 3</span></div></div>';
  return h;
}
function dayTrack(){
  let h = '<div class="daytrack">';
  for(let d = 1; d <= G.maxDays; d++) h += `<span class="${d < G.day ? 'past' : d === G.day ? 'now' : ''}">${['I','II','III','IV','V'][d-1]}</span>`;
  return h + '</div>';
}
function topbar(title){
  return `<div class="topbar"><div class="brand">${LOGO}<span>${title || 'ชายชุดดำ'}</span></div>
    <div class="row"><button class="btn ghost small" data-a="rules">กติกา</button>${G && view==='game' ? '<button class="btn ghost small" data-a="menu">เมนู</button>' : ''}</div></div>`;
}

function render(){
  store('mib-setup', S); store('mib-pref', PREF);
  if(G) store('mib-game', G); else drop('mib-game');
  clearInterval(timerInt); timerInt = null;
  document.body.classList.toggle('night', !!G && view === 'game' && (G.phase === 'night' || G.phase === 'nightIntro'));
  if(view === 'home') app.innerHTML = renderHome();
  else if(view === 'setup') app.innerHTML = renderSetup();
  else app.innerHTML = renderGame();
  window.scrollTo(0, 0);
}

function renderGame(){

  }

function renderNight(){
  const nt = G.nt, role = nt.steps[nt.i], r = ROLES[role], h0 = holderOf(role);
  if(nt.spoken !== nt.i){
    nt.spoken = nt.i; say(callLine(role));
    const idx = G.players.indexOf(h0), nIdx = G.notices.findIndex(x => x.p === idx);
    if(h0 && h0.alive && nIdx >= 0){ nt.note = G.notices[nIdx].text; G.notices.splice(nIdx, 1); }
  }
  let h = `${topbar(`คืนที่ ${G.day}`)}<p class="center muted small">ขั้นที่ ${nt.i+1}/${nt.steps.length}</p>
    <div class="bigmsg">${r.th} <span class="muted" style="font-family:Oswald;letter-spacing:2px">${r.en}</span> ลืมตา</div>`;

  if(!canAct(role)){
    if(!nt.waitEnd) nt.waitEnd = Date.now() + 5000 + Math.random() * 5000;
    const left = Math.max(0, Math.ceil((nt.waitEnd - Date.now()) / 1000));
    clearTimeout(waitTimer);
    waitTimer = setTimeout(() => { if(G && G.phase === 'night' && G.nt.i === nt.i){ if(Date.now() >= nt.waitEnd) nextStep(); render(); } }, 1000);
    return h + `<div class="hidden-tip"><p class="muted">บทบาทนี้ทำอะไรไม่ได้คืนนี้</p><p class="muted small">รอสักครู่เพื่อไม่ให้คนอื่นเดาได้… ${left}</p></div>`;
  }

  if(role === 'murderer' && G.rolesInPlay.includes('accomplice')){
    const acc = G.nt.acts.find(a => a.role === 'accomplice');
    if(acc) h += `<div class="note">ข้อมูลจากผู้ช่วยคืนนี้: ${esc(acc.text)}</div>`;
  }
  if(nt.note) h += `<div class="note">ข้อความถึงคุณ: ${nt.note}</div>`;

  if(nt.done){
    return h + `<div class="result ${r.team==='evil'?'evil':''}">${nt.result}</div>
      <div class="fab"><div class="wrap"><button class="btn primary" data-a="stepNext">เรียบร้อย — ${role==='accomplice'?'ไปต่อ (ฆาตกรเลือก)':'หลับตา'}</button></div></div>`;
  }
  h += `<p class="center muted small">${r.desc}</p><p class="center small">ห้องของคุณ: <b>${h0.room}</b></p>`;
  if(r.act === 'room'){
    h += boardHTML({pick: allowedRooms(role), sel: nt.sel});
    if(role === 'keymaster' && G.lastLock) h += `<p class="muted small center">ห้อง ${G.lastLock} ถูกล็อกเมื่อคืน ล็อกซ้ำไม่ได้</p>`;
  } else if(r.act === 'floor'){
    h += '<div class="grid3">';
    for(let f = G.floors; f >= 1; f--) h += `<button class="btn ${nt.sel===f?'sel':''}" data-a="pickVal" data-v="${f}">ชั้น ${f}</button>`;
    h += '</div>';
  } else if(r.act === 'col'){
    h += '<div class="grid3">';
    for(let c = 1; c <= 3; c++) h += `<button class="btn ${nt.sel===c?'sel':''}" data-a="pickVal" data-v="${c}">แถว ${c}<br><span class="small muted">x0${c}</span></button>`;
    h += '</div>';
  } else if(r.act === 'player'){
    h += '<div class="grid2">';
    G.players.forEach((p, i) => { if(p.alive && p !== h0) h += `<button class="btn ${nt.sel===i?'sel':''}" data-a="pickVal" data-v="${i}">${esc(p.name)}</button>`; });
    h += '</div>';
  }
  h += `<div class="fab"><div class="wrap">${role==='drunk'?'<button class="btn" data-a="skipAct">ไม่ใช้คืนนี้</button>':''}
    <button class="btn primary" data-a="confirmAct" ${nt.sel===null?'disabled':''}>ยืนยัน</button></div></div>`;
  return h;
}

  const m = G.morning;
  let h = `${topbar(`เช้าวันที่ ${G.day}`)}${dayTrack()}<div class="bigmsg">☀️ ทุกคนลืมตา</div><div class="stack">`;

  let h = `${topbar(`กลางวัน วันที่ ${G.day}`)}${dayTrack()}

  ${boardHTML()}
  <h3 style="margin-top:16px">ผู้เล่น (${alive.length} คนยังอยู่)</h3><div class="plist">`;
  G.players.forEach(p => h += `<div class="pitem ${p.alive?'':'dead'}"><span>${esc(p.name)}</span><span class="small muted">${p.alive?'':p.death}</span></div>`);
  h += `</div><h3 style="margin-top:16px">บันทึกสาธารณะ</h3><div class="log">${G.log.map(l => `<div>${l}</div>`).join('') || '<div>—</div>'}</div>
  <div class="fab"><div class="wrap"><button class="btn primary" data-a="toVote">ไปโหวตประชาทัณฑ์</button></div></div>`;
  if(G.timerRun) startTimer();
  return h;
}
function fmt(s){ s = Math.max(0, s); return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; }
function startTimer(){
  clearInterval(timerInt);
  timerInt = setInterval(() => {
    if(!G || G.phase !== 'day' || !G.timerRun){ clearInterval(timerInt); return; }
    G.timerLeft--; const el = document.getElementById('timer'); if(el) el.textContent = fmt(G.timerLeft);
    if(G.timerLeft <= 0){ G.timerRun = false; say('หมดเวลา ถึงเวลาโหวต'); clearInterval(timerInt); render(); }
    else if(G.timerLeft % 10 === 0) store('mib-game', G);
  }, 1000);
}

function renderVote(){
  return `${topbar(`ประชาทัณฑ์ วันที่ ${G.day}`)}
  <p class="center">ผู้เล่นที่ยังอยู่โหวตเลือก <b>ห้อง</b> ที่สงสัยว่าเป็นของฆาตกร<br><span class="muted small">เสียงข้างมากชนะ · ถ้าเสมอหรือไม่อยากเสี่ยง เลือก "ไม่ประชาทัณฑ์"</span></p>
  ${boardHTML({pick: allRooms().filter(r => !G.marks[r]), sel: G.voteSel})}
  <div class="fab"><div class="wrap"><button class="btn" data-a="voteNone">ไม่ประชาทัณฑ์</button>
  <button class="btn primary" data-a="voteGo" ${G.voteSel==null?'disabled':''}>${G.voteSel==null?'เลือกห้อง':`ลงมติห้อง ${G.voteSel}`}</button></div></div>`;
}
function renderVoteResult(){
  return `${topbar(`วันที่ ${G.day}`)}<div class="result ${/ถูกกำจัด/.test(G.voteLine)?'evil':''}" style="margin:16px 0">${G.voteLine}</div>
  ${boardHTML()}
  <div class="fab"><div class="wrap"><button class="btn primary" data-a="toNight">เข้าสู่คืนที่ ${G.day+1}</button></div></div>`;
}
function renderEnd(){
  const w = G.result, good = w.winner === 'good';
  let h = `${topbar('จบเกม')}<div class="result ${good?'':'evil'}" style="font-size:26px">${good?'ฝ่ายผู้เช่า ชนะ!':'ฝ่ายเงามืด ชนะ!'}<div class="small muted" style="font-size:15px">${w.reason}</div></div>
  <h3 style="margin-top:20px">เฉลยบทบาท</h3><table class="roles"><tr><th>ผู้เล่น</th><th>บทบาท</th><th>ห้อง</th><th>สถานะ</th></tr>`;
  G.players.forEach(p => h += `<tr><td>${esc(p.name)}</td><td style="color:${COLOR[ROLES[p.role].team]}">${ROLES[p.role].en}<br><span class="muted small">${ROLES[p.role].th}</span></td><td>${p.room}${p.startRoom!==p.room?`<br><span class="muted small">เดิม ${p.startRoom}</span>`:''}</td><td class="small">${p.alive?'รอด':p.death}</td></tr>`);
  h += `</table><h3 style="margin-top:20px">ย้อนดูทุกคืน (สำหรับทบทวน)</h3>`;
  G.history.forEach(n => {
    h += `<div class="panel" style="margin-bottom:8px"><b>คืนที่ ${n.night}</b><div class="log">`;
    n.acts.forEach(a => h += `<div><span style="color:${COLOR[ROLES[a.role].team]}">${ROLES[a.role].th}</span> (${esc(a.who)}): ${esc(a.text)}</div>`);
    h += '</div></div>';
  });
  h += `<h3>บันทึกสาธารณะ</h3><div class="log">${G.log.map(l => `<div>${l}</div>`).join('')}</div>
  <div class="fab"><div class="wrap"><button class="btn" data-a="home">หน้าแรก</button><button class="btn primary" data-a="again">เล่นอีกรอบ</button></div></div>`;
  return h;
}

/* ================= OVERLAYS ================= */
function showOverlay(html){ ov.innerHTML = `<div class="overlay"><div class="inner">${html}<button class="btn block" style="margin-top:16px" data-a="closeOv">ปิด</button></div></div>`; }
function rulesHTML(){
  return `<div class="rules"><h2>วิธีเล่น ชายชุดดำ</h2>
  <p>ในตึกพักอาศัยลึกลับ ชายชุดดำแฝงตัวอยู่ในหมู่ผู้เช่า ทุกคนรู้แค่ห้องของตัวเอง — ต้องรวบรวมเบาะแสจากความสามารถตอนกลางคืน แล้วโหวตบุกห้องที่สงสัยตอนกลางวัน</p>
  <h3>ฝ่าย</h3><ul><li><b style="color:var(--good)">ผู้เช่า</b> — ชนะเมื่อประชาทัณฑ์ฆาตกรได้</li>
  <li><b style="color:var(--evil)">เงามืด</b> (ฆาตกร + ผู้ช่วย) — ชนะเมื่อครบจำนวนวันแล้วฆาตกรยังรอด หรือผู้เช่าที่รอดเหลือไม่มากกว่าฝ่ายเงามืด</li></ul>
  <h3>เตรียมเกม</h3><ul><li>แต่ละคนได้การ์ดบทบาท 1 ใบ และคีย์การ์ดห้อง 1 ใบ (ห้องที่เหลือเป็นห้องว่าง)</li>
  <li>ฆาตกรและผู้ช่วยรู้ชื่อกันและกัน แต่ไม่รู้ห้องของกัน</li></ul>
  <h3>กลางคืน</h3><p>ทุกคนหลับตา แอปจะเรียกบทบาทตามลำดับ ผู้ถูกเรียกลืมตาแล้วเลือกบนเครื่อง:</p>
  <table class="roles">${Object.keys(ROLES).filter(k=>k!=='guest').sort((a,b)=>ROLES[a].order-ROLES[b].order).concat('guest').map(k=>`<tr><td>${ROLES[k].order||'-'}</td><td style="color:${COLOR[ROLES[k].team]}"><b>${ROLES[k].en}</b><br>${ROLES[k].th}</td><td>${ROLES[k].desc}</td></tr>`).join('')}</table>
  <p class="small muted" style="margin-top:8px">บทบาทที่ตายแล้วจะยังถูกเรียกและแอปรอเวลาสุ่ม เพื่อไม่ให้ใครเดาได้</p>
  <h3>เช้า</h3><ul><li>ถ้าฆาตกรบุกห้องที่มีคน และห้องไม่ถูกล็อก → ผู้พักห้องนั้นตาย ห้องถูกติดป้าย <b>ฆาตกรรม</b></li>
  <li>ถ้าบุกห้องว่าง → ห้องนั้นถูกติดป้าย <b>ห้องว่าง</b> ให้ทุกคนเห็น</li>
  <li>ถ้าห้องถูกล็อก → คืนนั้นสงบ ไม่มีใครรู้ว่าบุกห้องไหน</li></ul>
  <h3>กลางวัน</h3><ul><li>คุย แลกข้อมูล (จะพูดจริงหรือโกหกก็ได้) จับเวลาได้</li>
  <li>โหวต <b>ประชาทัณฑ์</b> ห้อง 1 ห้องด้วยเสียงข้างมาก — ถ้ามีคนอยู่ คนนั้นออกจากเกม (ป้าย <b>ประชาทัณฑ์</b>) ถ้าว่าง ติดป้ายห้องว่าง</li>
  <li>ผู้เล่นที่ตายแล้วห้ามพูดและห้ามโหวต</li></ul>
  <h3>ค่าเริ่มต้น</h3><ul><li>4 คน: 2 ชั้น 2 วัน · 5–6 คน: 3 ชั้น 3 วัน · 7–8 คน: 4 ชั้น 4 วัน · 9 คน: 5 ชั้น 4 วัน</li></ul>
  <h3>สองวิธีเล่น</h3><ul><li><b>มีผู้ดำเนินเกม</b>: 1 คนถือเครื่อง อ่าน/เปิดเสียง และกดตามที่ผู้เล่นชี้ แล้วหันจอให้ดูผลลัพธ์</li>
  <li><b>ไม่มีผู้ดำเนินเกม</b>: วางเครื่องกลางโต๊ะ เปิดเสียง ผู้ถูกเรียกหยิบเครื่องขึ้นมากดเอง</li></ul></div>`;
}
function galleryHTML(){
  return `<h2>การ์ดทั้งหมด</h2><div class="cards-strip">${Object.keys(ROLES).map(k => `<div>${cardSVG(k)}<p class="small muted center" style="margin-top:6px">${ROLES[k].desc}</p></div>`).join('')}</div>`;
}
function menuHTML(){
  return `<h2>เมนู</h2><div class="stack">
  <button class="btn block" data-a="rules">กติกา</button>
  <button class="btn block" data-a="toggleVoice">${PREF.voice ? 'ปิดเสียงผู้ดำเนินเกม' : 'เปิดเสียงผู้ดำเนินเกม'}</button>
  <button class="btn block" data-a="home">กลับหน้าแรก (เกมยังเก็บไว้)</button>
  <button class="btn danger block" data-a="abort">ยกเลิกเกมนี้</button></div>`;
}

/* ================= EVENTS ================= */
const A = {
  home(){ view = 'home'; ov.innerHTML = ''; render(); },
  toSetup(){ view = 'setup'; render(); },
  resume(){ view = 'game'; render(); },
  rules(){ showOverlay(rulesHTML()); },
  gallery(){ showOverlay(galleryHTML()); },
  menu(){ showOverlay(menuHTML()); },
  closeOv(){ ov.innerHTML = ''; },
  toggleVoice(){ PREF.voice = !PREF.voice; store('mib-pref', PREF); showOverlay(menuHTML()); },
  abort(){ if(confirm('ยกเลิกเกมนี้?')){ G = null; ov.innerHTML = ''; view = 'home'; render(); } },
  nMinus(){ S = makeSetup(S.n - 1, S.names); render(); },
  nPlus(){ S = makeSetup(S.n + 1, S.names); render(); },
  preset(){ S.roles = PRESET[S.n].slice(); S.floors = floorsFor(S.n); S.days = daysFor(S.n); render(); },
  start(){ startGame(); render(); },
  again(){ view = 'setup'; G = null; render(); },
  dealShow(){ G.dealShown = true; render(); },
  dealNext(){
    G.dealShown = false; G.dealIdx++;
    if(G.dealIdx >= G.players.length) beginNight();
    render();
  },
  nightGo(){ G.phase = 'night'; say('ทุกคน หลับตา', true); render(); },
  pickRoom(v){ if(G.phase === 'vote') G.voteSel = +v; else G.nt.sel = +v; render(); },
  pickVal(v){ G.nt.sel = +v; render(); },
  confirmAct(){ const nt = G.nt; if(nt.sel === null) return; applyAction(nt.steps[nt.i], nt.sel); render(); },
  skipAct(){ applyAction(G.nt.steps[G.nt.i], null); render(); },
  stepNext(){ nextStep(); render(); },
  noticeShow(){ G.morning.noticeShown = true; render(); },
  noticeDone(){ G.notices.shift(); G.morning.noticeShown = false; render(); },
  toDay(){ G.phase = 'day'; G.timerLeft = PREF.timer * 60; G.timerRun = false; render(); },
  timerToggle(){ G.timerRun = !G.timerRun; render(); },
  timerReset(){ G.timerRun = false; G.timerLeft = PREF.timer * 60; render(); },
  toVote(){ G.timerRun = false; G.phase = 'vote'; G.voteSel = null; say('ถึงเวลาประชาทัณฑ์'); render(); },
  voteNone(){ if(confirm('วันนี้ไม่ประชาทัณฑ์ใช่ไหม?')){ resolveVote(null); render(); } },
  voteGo(){ if(G.voteSel != null && confirm(`ประชาทัณฑ์ห้อง ${G.voteSel}?`)){ resolveVote(G.voteSel); render(); } },
  toNight(){ G.day++; beginNight(); render(); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if(!el) return;
  const fn = A[el.dataset.a]; if(fn){ e.preventDefault(); fn(el.dataset.v, el); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if(t.dataset.name !== undefined){ S.names[+t.dataset.name] = t.value; store('mib-setup', S); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.dataset.role){ const k = t.dataset.role; S.roles = t.checked ? S.roles.concat(k) : S.roles.filter(r => r !== k); render(); }
  else if(t.dataset.set){ S[t.dataset.set] = +t.value; render(); }
  else if(t.dataset.pref){ PREF[t.dataset.pref] = t.type === 'checkbox' ? t.checked : +t.value; render(); }
});

if(G && G.phase !== 'end') view = 'home';
render();
</script>
</body>
</html>
